name: Build Windows Desktop App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name DICOMSonifier --collect-all pydicom --collect-all pylibjpeg --collect-all sounddevice --collect-all soundfile --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 --hidden-import comtypes main.py
      - name: Smoke test (30 seconds)
        run: python scripts/smoke_test.py dist\DICOMSonifier\DICOMSonifier.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DICOMSonifier-windows
          path: dist/DICOMSonifier
